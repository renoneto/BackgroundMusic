<?xml version="1.0" encoding="UTF-8"?>
<!-- FermataIcon.svg: simple app/status-bar icon for Background Music. -->
<!-- One bold letter R on a flat purple tile for small-size clarity. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="72" y="72" width="880" height="880" rx="220" fill="#6847D9"/>
  <text x="512" y="760"
        text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-size="640"
        font-weight="700"
        fill="#FFF7E8">R</text>
</svg>
